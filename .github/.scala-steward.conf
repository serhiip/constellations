pullRequests.grouping = [
  { name = "patches", title = "Patch updates", filter = [{ version = "patch" }] },
  { name = "typelevel", title = "Typelevel updates", filter = [
    { group = "org.typelevel" },
    { group = "org.http4s" },
    { group = "co.fs2" },
    { group = "io.circe" }
  ]},
  { name = "aws", title = "AWS SDK updates", filter = [{ group = "software.amazon.awssdk" }] },
  { name = "google", title = "Google library updates", filter = [
    { group = "com.google.cloud" },
    { group = "com.google.genai" }
  ]}
]
